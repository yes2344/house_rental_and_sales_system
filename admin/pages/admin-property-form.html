<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Listing | Admin</title>
    <meta name="description" content="Create or update property details for the public listings portal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/admin-styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="admin-dashboard.html">
          <span class="brand-mark">H</span>
          <span><strong>Habasha Property Center</strong><small>Admin Portal</small></span>
        </a>

        <nav class="main-nav" aria-label="Admin navigation">
          <a href="admin-dashboard.html">Dashboard</a>
          <a href="admin-property-list.html">Properties</a>
          <a href="admin-property-form.html" class="active">Add property</a>
          <a href="admin-viewing-requests.html">Viewings</a>
        </nav>

        <div class="nav-actions">
          <button class="btn btn-ghost">Logout</button>
          <a href="../../index.html" class="btn btn-primary">Public site</a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="container">
        <div class="action-row">
          <div>
            <span class="eyebrow" style="background: var(--admin-brand-soft); color: var(--admin-brand);">Listing form</span>
            <h1 style="margin: 0;">Create property listing</h1>
          </div>
          <a href="admin-property-list.html" class="btn btn-secondary">Back to list</a>
        </div>

        <div class="details-card">
          <form class="property-form">
            <div class="form-grid">
              <label>
                <span>Property title</span>
                <input type="text" value="Green Valley Residence" />
              </label>
              <label>
                <span>Price</span>
                <input type="text" value="$240,000" />
              </label>
              <label>
                <span>Location</span>
                <input type="text" value="Addis Ababa" />
              </label>
              <label>
                <span>Property type</span>
                <select>
                  <option selected>House</option>
                  <option>Villa</option>
                  <option>Apartment</option>
                  <option>Land</option>
                </select>
              </label>
              <label>
                <span>Bedrooms</span>
                <input type="number" value="3" />
              </label>
              <label>
                <span>Bathrooms</span>
                <input type="number" value="2" />
              </label>
              <label class="field-full">
                <span>Property description</span>
                <textarea rows="5">Beautiful family home with spacious rooms, outdoor veranda, and modern finishings.</textarea>
              </label>
              <label class="field-full">
                <span>Features</span>
                <textarea rows="3">Garage, balcony, landscaped yard, secure gate, near schools and market</textarea>
              </label>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary">Draft</button>
              <button type="submit" class="btn btn-primary">Publish listing</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer" style="background: #0f1f24; color: rgba(255,255,255,0.8); padding: 32px 0 18px;">
      <div class="container" style="display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center;">
        <span>© <span id="year"></span> Habasha Property Center Admin</span>
        <span>Listing editor</span>
      </div>
    </footer>

    <script src="../assets/admin-script.js"></script>
  </body>
</html>
