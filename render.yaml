services:
  - type: web
    name: kefaleshabeshahome-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn house.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile -
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: kefaleshabeshahome-api.onrender.com
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_CACHE_BACKEND
        value: django.core.cache.backends.locmem.LocMemCache
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        value: accounts.email_backend.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
