services:
  - type: web
    name: infinity-house-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health/
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MEDIA_ROOT
        sync: false
      - key: PRIVATE_MEDIA_ROOT
        sync: false
      - key: MEDIA_CAPACITY_BYTES
        sync: false
