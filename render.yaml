services:
  - type: web
    name: kefaleshabeshahome-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_demo_admin && gunicorn house.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile -
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: kefaleshabeshahome-api.onrender.com
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "True"
      - key: DJANGO_CACHE_BACKEND
        value: django.core.cache.backends.locmem.LocMemCache
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
